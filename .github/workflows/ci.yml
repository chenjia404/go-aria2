name: ci

on:
  # 仅主分支 push 触发，避免 PR 分支 push 与 pull_request 重复跑同一套 CI
  push:
    branches:
      - master
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit & compat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go test ./...
        run: go test ./...

      - name: aria2 RPC 兼容性单元测试
        run: go test ./internal/compat/aria2/...

  integration:
    name: aria2 daemon 对比集成测试
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 aria2
        run: sudo apt-get update && sudo apt-get install -y aria2

      - name: 验证 aria2c 版本
        run: aria2c --version | head -1

      - name: 与官方 aria2 daemon RPC 对比
        run: go test -tags=integration -timeout 10m ./internal/compat/aria2/integration/... -v

      - name: 进程级集成测试
        run: go test -tags=integration -timeout 5m ./internal/app/...
